name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,plot]"
      - run: python -m pytest -q

  companion-arm64:
    # the Jetsons run Ubuntu 24.04, aarch64, Python 3.12: the companion payload must import and its tests must pass there
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python -c "import artex.agent.drone_agent, artex.agent.safety_rules, artex.agent.offboard_control, artex.fleetops.fallback, artex.common.version; print('companion imports ok')"
      - run: python -m pytest -q tests/test_safety_rules.py tests/test_offboard_control.py tests/test_agent_guard.py tests/test_fallback.py tests/test_mission_downlink.py tests/test_version_handshake.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, companion-arm64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y fakeroot
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]" && bash packaging/build_bundles.sh
      - uses: actions/upload-artifact@v4
        with:
          name: artex-release
          path: dist/
